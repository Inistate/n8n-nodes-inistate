# Publishes a tagged release from GitHub with npm provenance.
#
# FIRST PUBLISH (package does not exist on npm yet):
# npm trusted publishing cannot bootstrap a new package -- the trusted publisher
# record lives on the package settings page, which only exists after v1 is up.
# So the first release authenticates with a token:
# 1. npmjs.com -> Access Tokens -> Generate -> Granular access token.
#      Permissions: Packages and scopes = "Read and write"
#      Select packages: "All packages" (you cannot scope to a package that
#      does not exist yet). Set a short expiry.
# 2. Add it as the repo secret NPM_TOKEN.
# 3. Run this workflow (tag push, or Actions -> Publish -> Run workflow).
#
# AFTER THE FIRST PUBLISH (switch to OIDC, no long-lived token):
# 1. Open the n8n-nodes-inistate package settings on npmjs.com.
# 2. Add a GitHub Actions trusted publisher for:
#      owner: Inistate
#      repository: n8n-nodes-inistate
#      workflow: publish.yml
#    Leave the environment blank.
# 3. Revoke the npm token, delete the NPM_TOKEN secret, and drop the
#    NODE_AUTH_TOKEN env block from the publish step below.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.15.0

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish with provenance
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
